["bot.ec.notif_owner"]
other = "<b>Уведомления</b>\n\nЭтот бот не присылает оповещения о продажах. Они приходят из {{.Bot}}: сообщение о каждом оплаченном заказе и каждом возврате, за секунды, в чат на ваш выбор.\n\nКак подключить свой чат:\n1. Создайте группу (или возьмите готовую) и добавьте в неё {{.Bot}}.\n2. Откройте {{.Bot}} кнопкой ниже. Владельцы там администраторы: свои чаты вы добавляете и убираете сами.\n3. Коллеги, которым нужны оповещения, вступают в ту же группу.\n\nВ сообщениях есть контакты покупателей, поэтому держите группу только для своей команды."

["bot.ec.notif_manager"]
other = "<b>Уведомления</b>\n\nЭтот бот не присылает оповещения о продажах. Они приходят из {{.Bot}}: сообщение о каждом оплаченном заказе и каждом возврате, за секунды.\n\nКакие чаты получают оповещения, решает только владелец организации. Попросите владельца добавить вас в чат или подключить новый. В сообщениях есть контакты покупателей."
