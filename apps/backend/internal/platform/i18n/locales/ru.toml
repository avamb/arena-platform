["bot.scanner.text"]
other = "<b>Сканер билетов</b>\n\nПриложение для проверки билетов на входе: наведите камеру телефона на код на билете, и приложение покажет, действителен ли он. Установите его на телефоны тех, кто будет стоять на входе. Отдельное оборудование не нужно.\n\n💡 При создании ивента бот спросит, во сколько открывается вход. Укажите время: гости приедут чуть раньше, у входа не будет очереди, и мероприятие начнётся вовремя.\n\nОбразец билета, который бот присылает после создания ивента, сканер распознаёт как образец и не гасит, так что попробовать можно сразу."

