["bot.help"]
other = "<b>Что умеет бот</b>\n\n- <b>+ Ивент</b>: заводит ивент по шагам и публикует его. Название можно написать или прислать афишу: я прочитаю с неё данные, а вы подтвердите каждое значение. В конце пришлю ссылку для покупателей и образец билета.\n- <b>Мои ивенты</b>: все ивенты вашей организации, ближайшие первыми, с проданными и свободными местами и деньгами по каждой дате. В карточке ивента его можно изменить, повторить как новый, посмотреть образец билета, перенести или отменить сеанс: покупатели получат письмо.\n- <b>Уведомления</b>: откуда приходят оповещения о продажах и возвратах и как подключить свой чат.\n- <b>Сотрудники</b>: владелец приглашает коллег и убирает их.\n- <b>Организация</b>: если вы работаете в нескольких организациях, переключайтесь здесь.\n- <b>Сканер билетов</b>: приложение для проверки билетов на входе, ссылки на Google Play и App Store.\n- <b>Язык</b>: русский, английский или испанский."

