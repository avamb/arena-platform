["bot.invite_accepted"]
other = "<b>Готово!</b> Вы подключены к организации <b>{{.Org}}</b> как {{.Role}}.\n\n<b>Как это работает</b>\n1. Нажмите «+ Мероприятие» и напишите название мероприятия. Если есть афиша, пришлите её: я прочитаю с неё данные.\n2. Ответьте на несколько вопросов: дата, место, билеты. Перед публикацией я покажу всё, что получилось.\n3. Получите ссылку для покупателей и образец билета. Ссылку можно сразу публиковать.\n\nПродажи смотрите в «Мои мероприятия»{{if .Owner}}, а коллег можно пригласить из этого же меню{{end}}. Всё это в меню ниже, а в «Помощи» эта подсказка всегда под рукой."

