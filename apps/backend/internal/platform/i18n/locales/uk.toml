["bot.scanner.text"]
other = "<b>Сканер квитків</b>\n\nЗастосунок для перевірки квитків на вході: наведіть камеру телефона на код на квитку, і застосунок покаже, чи дійсний він. Встановіть його на телефони тих, хто стоятиме на вході. Окреме обладнання не потрібне.\n\n💡 Під час створення заходу бот запитає, о котрій відкривається вхід. Вкажіть час: гості приїдуть трохи раніше, біля входу не буде черги, і захід розпочнеться вчасно.\n\nЗразок квитка, який бот надсилає після створення заходу, сканер розпізнає як зразок і не погашає, тож спробувати можна одразу."

