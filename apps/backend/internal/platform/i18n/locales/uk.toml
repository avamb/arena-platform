# uk.toml — Ukrainian message catalog for arena_new.
#
# Every key must match a key in en.toml. go-i18n/v2 falls back to English
# (en.toml) for any missing message, so a partial catalog is safe.
#
# The Telegram bot keys (bot.*) live in a separate part of this catalog and
# are checked against eventbot.MessageKeys (eventbot.SupportedLocales).
#
# Tone: polite "ви", like the Ukrainian e-mails of the product.
# Glossary: захід (event), сеанс (session), квиток (ticket), замовлення
# (order), покупець (buyer), категорія (category), майданчик (venue),
# бронь (hold), повернення коштів (refund), промокод, організація.

