["bot.help"]
other = "<b>Що вміє бот</b>\n\n- <b>➕ Новий захід</b>: створює захід за кроками та публікує його. Назву можна написати або надіслати афішу: я прочитаю з неї дані, а ви підтвердите кожне значення. Наприкінці надішлю посилання для покупців і зразок квитка.\n- <b>📅 Мої заходи</b>: усі заходи вашої організації, найближчі першими, з проданими й вільними місцями та грошима за кожним сеансом. У картці заходу його можна змінити, повторити як новий, подивитися зразок квитка, перенести або скасувати сеанс: покупці отримають лист.\n- <b>🧾 Замовлення та повернення</b>: замовлення ваших покупців, повернення грошей і спори щодо оплати.\n- <b>📣 Просування</b>: промокоди, безкоштовні квитки, посилання продажів із QR-кодами та розсилки покупцям.\n- <b>🚪 Вхід на захід</b>: застосунок для перевірки квитків на вході, посилання на Google Play і App Store. Там само список гостей сеансу.\n- <b>🛍 Магазин</b>: замовлення й залишки вашого магазину, якщо він є в організації.\n- <b>⚙️ Налаштування</b>: дані організації, приймання оплати, команда, бренди, майданчики та сповіщення. Там само мова (українська, англійська або іспанська) і перемикання між організаціями. Команду змінює власник, менеджер її бачить.\n- <b>🌐 Відкрити в браузері</b>: відкриває веб-івент-центр за одним посиланням.\n\nБлок <b>Перші кроки</b> на початку меню показує, що потрібно зробити, щоб розпочати продажі."

