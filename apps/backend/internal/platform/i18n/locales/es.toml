["bot.invite_accepted"]
other = "<b>¡Listo!</b> Ya estás conectado a <b>{{.Org}}</b> como {{.Role}}.\n\n<b>Cómo funciona</b>\n1. Pulsa «+ Evento» y escribe el nombre del evento. Si tienes el cartel, envíalo: leeré los datos.\n2. Responde a unas preguntas: fecha, recinto, entradas. Antes de publicar te muestro todo.\n3. Recibes el enlace para los compradores y una entrada de muestra. Puedes compartir el enlace enseguida.\n\nLas ventas están en «Mis eventos»{{if .Owner}}; a tus compañeros los invitas desde el mismo menú{{end}}. Todo está en el menú de abajo, y en «Ayuda» tienes esta guía siempre a mano."

