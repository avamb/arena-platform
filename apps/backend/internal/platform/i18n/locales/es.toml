# es.toml — Spanish message catalog for arena_new.
#
# Only the Telegram event-center bot (the bot.* keys) is translated so far.
# Every other key falls back to en.toml through go-i18n's built-in fallback
# chain, so a partial catalog is safe. The keys mirror en.toml one to one:
# eventbot.MessageKeys and the wizard key lists are checked against every
# language the bot speaks (eventbot.SupportedLocales).
#
# Tone: informal "tú", like the Spanish e-mails of the product.

