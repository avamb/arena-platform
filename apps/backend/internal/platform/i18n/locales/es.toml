["bot.scanner.text"]
other = "<b>Escáner de entradas</b>\n\nLa aplicación para comprobar las entradas en la puerta: apunta la cámara del teléfono al código de la entrada y la aplicación te dice si es válida. Instálala en los teléfonos de quienes estarán en el acceso. No hace falta ningún equipo adicional.\n\n💡 Al crear un evento el bot te preguntará a qué hora se abre la entrada. Indícala: los asistentes llegarán un poco antes, no habrá cola en la puerta y el evento empezará puntual.\n\nLa entrada de muestra que envía el bot al crear un evento la reconoce el escáner como muestra y no se gasta, así que puedes probarla enseguida."

["bot.scanner.android_btn"]
