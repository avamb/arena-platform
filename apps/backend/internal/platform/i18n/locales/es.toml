["bot.wz.ask_poster"]
other = "Envía el cartel. Lo mejor es <b>como archivo</b>, para no perder calidad:\n• en el móvil: clip 📎 → “Archivo” → elige la imagen;\n• en el ordenador: clip 📎 → elige la imagen → marca “Enviar como documento” en la ventana de envío.\nUna foto normal también sirve, pero Telegram la comprime.\n\nPNG o JPG de hasta 5 MB, en formato 4:5 (1080×1350) o cuadrado, de al menos 1000 px de ancho. Deja todo lo importante en el centro: la web recorta la parte de arriba y la de abajo en las tarjetas. Sin cartel, la tarjeta del evento en la web no se abrirá, pero puedes añadirlo más tarde."

