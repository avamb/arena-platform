["bot.not_invited"]
other = "¡Hola! Este bot crea eventos y muestra las ventas a los organizadores de Arena Sold Out.\n\nPara usarlo necesitas una invitación: el propietario de tu organización la envía desde este bot y te llega por e-mail como un enlace. Abre ese enlace y ya estarás dentro."

