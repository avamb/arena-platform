["bot.help"]
other = "<b>Functions of this bot</b>\n\n- <b>+ Event</b>: makes an event step by step and publishes it. Type the name or send a poster. I read the data from the poster and you accept each value. At the end I send the link for buyers and a sample ticket.\n- <b>My events</b>: each event of your organization, the nearest first, with sold and free seats and the money for each date. On the event card you can edit the event, copy it as a new event and see a sample ticket. You can also move or cancel a session. Buyers get an e-mail.\n- <b>Notifications</b>: which bot sends the sales and refund notifications and how to connect your chat.\n- <b>Team</b>: the owner changes the team, the manager sees it.\n- <b>Organization</b>: if you work for more than one organization, switch between them here.\n- <b>Ticket scanner</b>: the app to scan tickets at the door, with links to Google Play and the App Store.\n- <b>Language</b>: English, Russian or Spanish."

