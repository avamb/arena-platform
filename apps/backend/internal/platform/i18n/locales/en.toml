["bot.wz.ask_poster"]
other = "Send the poster as a file, so the quality stays the same. A plain photo also works, but Telegram compresses it.\n\n<b>On a phone:</b>\n1. Tap the paperclip 📎.\n2. Tap “File”.\n3. Select the picture.\n\n<b>On a computer:</b>\n1. Click the paperclip 📎.\n2. Select the picture.\n3. In the send window, select the check box “Send as a document”.\n\n<b>Requirements:</b>\n• PNG or JPG, maximum 5 MB.\n• Ratio 4:5 (1080×1350) or square.\n• Minimum width 1000 px.\n\nThe site crops the top and the bottom of the poster in cards. Put the important parts in the center.\n\nWithout a poster, the event card does not open on the site. You can add the poster later."

