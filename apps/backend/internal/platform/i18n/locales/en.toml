["bot.scanner.text"]
other = "<b>Ticket scanner</b>\n\nUse the app to make sure tickets are valid at the entrance. Point the camera of the phone at the code on the ticket. The app shows if the ticket is valid. Install the app on the phones of the people at the entrance. No extra equipment is necessary.\n\n💡 When you make an event, the bot asks when the entrance opens. Give a time. Then guests come earlier, there is no queue at the entrance, and the event starts on time.\n\nAfter you make an event, the bot sends a sample ticket. The scanner knows that it is a sample and does not use it. You can try it at once."

