["bot.rfp.rules"]
other = "<b>Check and start</b>\n\nA friend gets {{.Friend}} % off. The buyer who invited the friend gets {{.Cashback}} % of the friend's ticket price back (after the discount, without the service fee), at most {{.Cap}} % of the price of the buyer's tickets. Friends for each code: {{.Max}}.\n\n<b>Rules</b>\n1. Arena pays the cashback after the event: one day after the friend's session ends.\n2. If the friend gets a refund or opens a dispute before that, there is no cashback. Arena does not take back cashback that it paid.\n3. Arena pays the cashback from your Stripe balance. If the balance is too low, Arena tells you and waits up to 30 days. After that Arena does not pay the cashback, and you must agree on the payment with the buyer.\n4. Arena does not refund the fee of the payment provider.\n5. The money goes to the card that the buyer paid with. If this is not possible, Arena pays no cashback and the money stays with you. Arena tells the buyer to contact you.\n6. Payments are automatic. To stop new discounts and new cashback, press Pause."

