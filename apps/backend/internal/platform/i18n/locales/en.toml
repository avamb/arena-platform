["bot.wz.ask_poster"]
other = "Send the poster as a file to keep the quality. An image sent as a photo also works, but Telegram compresses it.\n\n<b>On a phone:</b>\n1. Tap the paperclip 📎.\n2. Tap “File”.\n3. Select the image.\n\n<b>On a computer:</b>\n1. Click the paperclip 📎.\n2. Select the image.\n3. In the send window, select the check box “Send as a document”.\n\n<b>Requirements:</b>\n• PNG or JPG, 5 MB maximum.\n• Ratio 4:5 (1080×1350) or square.\n• Minimum width 1000 px.\n\nThe site cuts the top and the bottom of the poster in cards. Put the important parts in the center.\n\nThe event card does not open on the site if there is no poster. You can add the poster after this step."

