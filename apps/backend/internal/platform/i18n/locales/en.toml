["bot.scanner.text"]
other = "<b>Ticket scanner</b>\n\nUse the app to check tickets at the door. Point the phone's camera at the code on the ticket. The app shows whether the ticket is valid. Install it on the phones of whoever stands at the entrance. You need no extra equipment.\n\n💡 When you create an event the bot asks when the doors open. Give a time: guests arrive a little earlier, there is no queue at the entrance, and the event starts on time.\n\nThe bot sends a sample ticket after you create an event. The scanner knows it is a sample and does not use it up. You can try it right away."

