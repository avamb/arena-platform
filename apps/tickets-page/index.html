<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Arena Sold Out</title>
    <meta name="description" content="Buy tickets — Arena Sold Out" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- The bars stay full-bleed (background + rule span the viewport); the
           .asa-container wrapper inside each one keeps their contents on the
           same centred column as <main>. -->
      <header class="asa-header">
        <div class="asa-header__in asa-container">
          <a class="asa-wordmark" href="/" aria-label="Arena Sold Out home">
            Arena<span class="asa-wordmark-accent">SoldOut</span>
          </a>
        </div>
      </header>
      <main id="asa-main" class="asa-main asa-container" aria-live="polite">
        <p class="asa-loading" role="status">Loading…</p>
      </main>
      <footer class="asa-footer">
        <div class="asa-footer__in asa-container">
          <p id="asa-footer-text">&copy; Arena Sold Out</p>
        </div>
      </footer>
    </div>

    <!-- The <arena-tickets> widget is loaded dynamically by main.ts (never
         a static <script src> here) — see loadWidgetScript(): the bundle
         lives at /widget/v1/arena-tickets.js, served by this same nginx
         container from the widget build stage (see Dockerfile), and Vite
         cannot resolve that path at build time since it is not part of
         this app's own module graph. Never jsDelivr or any third-party CDN
         for the production hosted page. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
