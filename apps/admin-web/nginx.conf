# PR-07: nginx configuration for the admin-web production container.
#
# Key properties:
#   - Listens on port 8080 (non-root; no CAP_NET_BIND_SERVICE required).
#   - Serves the Vite SPA bundle from /usr/share/nginx/html.
#   - SPA fallback: unknown paths → index.html (client-side routing).
#   - Immutable cache for hashed assets (*.js, *.css with content-hash names).
#   - Security headers: no-sniff, frame-options, XSS-protection.
#   - /health returns 200 OK for container healthchecks (no access log noise).
#   - Gzip compression on text assets.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text/html, js, css, json responses
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health endpoint — returns 200 for Docker/Dokploy healthchecks.
    # Not logged to reduce noise in access logs.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Immutable cache for content-hashed static assets produced by Vite
    # (e.g. vendor-react-aBcDeFg.js, index-XyZ123.css).
    # The hash in the filename guarantees cache-busting on deploy.
    location ~* \.(js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must NOT be cached — it is the SPA entry point and
    # must be re-fetched on every deploy so the client picks up new
    # hashed chunk URLs.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA catch-all: any path that does not match a real file is served
    # the SPA index so TanStack Router can handle client-side navigation.
    location / {
        try_files $uri /index.html;
    }
}
