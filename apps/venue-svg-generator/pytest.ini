[pytest]
# Tests of the three pipeline packages plus the independent evaluator.
# benchmark_v1 is not collected: it imports the git-ignored seating_poc package.
# Tests that need private client data are skipped by conftest.py when it is absent.
testpaths = xlsx_seating_adapter seating_svg_renderer m1_product independent_evaluation arena_export service pdf_seating_adapter raster_seating_adapter venue_generator bil24_svg_exporter hall_model

markers =
    private_data: needs private client files that are not in the repository (skipped when absent)
