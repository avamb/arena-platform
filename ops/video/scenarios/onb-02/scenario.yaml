id: onb-02
fps: 30
languages: [ru, en, es]
title:
  ru: "Заявка на сайте и первый вход в ивент-центр"
  en: "Application on the website and first sign-in to the event center"
  es: "Solicitud en la web y primer acceso al centro de eventos"

# Pictures in captures/ are made by scripts/capture-onb-02.ts and scripts/render-letter.ts
# (see README, "Film onb-02") and are not committed. Russian pictures lie in captures/,
# English and Spanish in captures/en/ and captures/es/.
# 16x9 shows desktop pictures (captures/d_*.png, ONB_VIEW=desktop) in a browser window with a close-up;
# 9x16 and 4x5 show the phone pictures.
# The applicant is invented: Carmen Ortega, Aurora Events, Madrid, carmen@example.com.

voice:
  provider: auto
  elevenlabs:
    voice_id_env: ELEVENLABS_VOICE_ID
    model_id: eleven_multilingual_v2

formats: [16x9, 9x16, 4x5]
background: "#4f46e5"

scenes:
  - id: s1-form
    narration:
      ru: "Чтобы продавать билеты через Arena Sold Out, оставьте заявку на сайте. Напишите имя, e-mail и телефон и нажмите «Продолжить»."
      en: "To sell tickets with Arena Sold Out, apply on the website. Type your name, e-mail and phone number, then press Continue."
      es: "Para vender entradas con Arena Sold Out, deja tu solicitud en la web. Escribe tu nombre, tu correo y tu teléfono y pulsa «Continuar»."
    pause_after: 0.4
    shots:
      - image: captures/f_01_start.png
        frame: phone
        title: { ru: "arenasoldout.com → «Начать продавать»", en: "arenasoldout.com → Start selling", es: "arenasoldout.com → «Empieza a vender»" }
        weight: 2
        per_format:
          16x9:
            image: captures/d_f_01_start.png
            frame: browser
            address: { ru: "arenasoldout.com/ru/start", en: "arenasoldout.com/start", es: "arenasoldout.com/es/start" }
            zoom: { from: 1.0, to: 1.15, x: 0.2, y: 0.2 }
      - image: captures/f_02_contact.png
        frame: phone
        title: { ru: "Шаг 1: о вас", en: "Step 1: about you", es: "Paso 1: sobre ti" }
        weight: 3
        scroll: { from: 0, to: 0.75 }
        per_format:
          16x9:
            image: captures/d_f_02_contact.png
            frame: browser
            address: { ru: "arenasoldout.com/ru/start", en: "arenasoldout.com/start", es: "arenasoldout.com/es/start" }
            zoom: { from: 1.5, to: 1.6, x: 0.0, y: 0.32 }

  - id: s2-confirm
    narration:
      ru: "На почту придёт письмо. Нажмите в нём кнопку и подтвердите адрес. Ответы сохраняются, заявку можно продолжить позже."
      en: "You get an e-mail. Press the button in it to confirm your address. Your answers are saved, so you can continue later."
      es: "Recibes un correo. Pulsa el botón para confirmar tu dirección. Tus respuestas se guardan y puedes continuar más tarde."
    pause_after: 0.6
    shots:
      # The body of the real letter of the stand; the bar above it is drawn (scripts/render-letter.ts).
      - image: captures/l_01_confirm.png
        frame: phone
        title: { ru: "Письмо со ссылкой", en: "E-mail with the link", es: "Correo con el enlace" }
        weight: 3
        zoom: { from: 1.0, to: 1.12, x: 0.4, y: 0.45 }
        per_format:
          16x9:
            image: captures/d_l_01_confirm.png
            frame: browser
            zoom: { from: 1.25, to: 1.4, x: 0.5, y: 0.25 }
      - image: captures/f_04_confirmed.png
        frame: phone
        title: { ru: "Почта подтверждена", en: "E-mail confirmed", es: "Correo confirmado" }
        weight: 2
        zoom: { from: 1.0, to: 1.15, x: 0.4, y: 0.25 }
        per_format:
          16x9:
            image: captures/d_f_04_confirmed.png
            frame: browser
            address: { ru: "arenasoldout.com/ru/start/confirm", en: "arenasoldout.com/start/confirm", es: "arenasoldout.com/es/start/confirm" }
            zoom: { from: 1.35, to: 1.5, x: 0.15, y: 0.3 }

  - id: s3-steps
    narration:
      ru: "Дальше четыре коротких шага. Ваша организация. Ваши мероприятия. Билеты и оплата. И согласия."
      en: "Then there are four short steps. Your organization. Your events. Tickets and payment. And the agreements."
      es: "Después hay cuatro pasos breves. Tu organización. Tus eventos. Entradas y pagos. Y las aceptaciones."
    pause_after: 1.5
    shots:
      - image: captures/f_05_org.png
        frame: phone
        title: { ru: "Шаг 2: организация", en: "Step 2: your organization", es: "Paso 2: tu organización" }
        weight: 4
        scroll: { from: 0, to: 0.7 }
        per_format:
          16x9:
            image: captures/d_f_05_org.png
            frame: browser
            address: { ru: "arenasoldout.com/ru/start", en: "arenasoldout.com/start", es: "arenasoldout.com/es/start" }
            zoom: { from: 1.5, to: 1.6, x: 0.0, y: 0.32 }
      - image: captures/f_06_events.png
        frame: phone
        title: { ru: "Шаг 3: мероприятия", en: "Step 3: your events", es: "Paso 3: tus eventos" }
        weight: 3
        scroll: { from: 0, to: 0.45 }
        per_format:
          16x9:
            image: captures/d_f_06_events.png
            frame: browser
            address: { ru: "arenasoldout.com/ru/start", en: "arenasoldout.com/start", es: "arenasoldout.com/es/start" }
            zoom: { from: 1.5, to: 1.6, x: 0.0, y: 0.32 }
      - image: captures/f_07_payment.png
        frame: phone
        title: { ru: "Шаг 4: билеты и оплата", en: "Step 4: tickets and payment", es: "Paso 4: entradas y pagos" }
        weight: 3
        scroll: { from: 0, to: 0.45 }
        per_format:
          16x9:
            image: captures/d_f_07_payment.png
            frame: browser
            address: { ru: "arenasoldout.com/ru/start", en: "arenasoldout.com/start", es: "arenasoldout.com/es/start" }
            zoom: { from: 1.5, to: 1.6, x: 0.0, y: 0.32 }

  - id: s4-submit
    narration:
      ru: "Отметьте три согласия и отправьте заявку. Мы читаем каждую заявку и пишем вам на почту."
      en: "Tick the three agreements and send the application. We read every application and write to you by e-mail."
      es: "Marca las tres aceptaciones y envía la solicitud. Leemos cada solicitud y te escribimos por correo."
    pause_after: 0.8
    shots:
      - image: captures/f_08_consents.png
        frame: phone
        title: { ru: "Шаг 5: согласия", en: "Step 5: agreements", es: "Paso 5: aceptaciones" }
        weight: 3
        per_format:
          16x9:
            image: captures/d_f_08_consents.png
            frame: browser
            address: { ru: "arenasoldout.com/ru/start", en: "arenasoldout.com/start", es: "arenasoldout.com/es/start" }
            zoom: { from: 1.5, to: 1.6, x: 0.0, y: 0.32 }
      - image: captures/f_09_thanks.png
        frame: phone
        title: { ru: "Заявка отправлена", en: "Application sent", es: "Solicitud enviada" }
        weight: 2
        per_format:
          16x9:
            image: captures/d_f_09_thanks.png
            frame: browser
            address: { ru: "arenasoldout.com/ru/start/thanks", en: "arenasoldout.com/start/thanks", es: "arenasoldout.com/es/start/thanks" }
            zoom: { from: 1.2, to: 1.3, x: 0.1, y: 0.45 }

  - id: s5-password
    narration:
      ru: "После одобрения придёт письмо с кнопкой «Задать пароль». Придумайте пароль и сохраните его."
      en: "After the approval you get an e-mail with the button Choose a password. Think of a password and save it."
      es: "Tras la aprobación recibes un correo con el botón «Elegir contraseña». Piensa una contraseña y guárdala."
    pause_after: 0.8
    shots:
      # The body of the real letter of the stand; the bar above it is drawn (scripts/render-letter.ts).
      - image: captures/l_02_invite.png
        frame: phone
        title: { ru: "Письмо после одобрения", en: "E-mail after the approval", es: "Correo tras la aprobación" }
        weight: 3
        scroll: { from: 0, to: 0.9 }
        per_format:
          16x9:
            image: captures/d_l_02_invite.png
            frame: browser
            zoom: { from: 1.25, to: 1.4, x: 0.5, y: 0.45 }
      - image: captures/p_02_password.png
        frame: phone
        title: { ru: "Задайте пароль", en: "Choose a password", es: "Elige una contraseña" }
        weight: 2
        per_format:
          16x9:
            image: captures/d_p_02_password.png
            frame: browser
            address: "events.arenasoldout.com/accept-invite"
            zoom: { from: 1.5, to: 1.65, x: 0.5, y: 0.25 }
      - image: captures/p_03_after_password.png
        frame: phone
        title: { ru: "Пароль сохранён", en: "Password saved", es: "Contraseña guardada" }
        weight: 2
        per_format:
          16x9:
            image: captures/d_p_03_after_password.png
            frame: browser
            address: "events.arenasoldout.com/accept-invite"
            zoom: { from: 1.5, to: 1.65, x: 0.5, y: 0.25 }

  - id: s6-center
    narration:
      ru: "Войдите в ивент-центр с вашим e-mail и паролем. Блок «Первые шаги» показывает, что сделать: заполнить данные организации, подключить приём оплаты, создать первое мероприятие и получить ссылку продаж."
      en: "Sign in to the event center with your e-mail and password. The First steps block shows what to do: add your organization data, connect payments, add your first event and get a sales link."
      es: "Entra en el centro de eventos con tu correo y tu contraseña. El bloque «Primeros pasos» te muestra qué hacer: completar los datos de la organización, conectar el cobro de pagos, crear tu primer evento y obtener el enlace de venta."
    pause_after: 1.5
    shots:
      - image: captures/e_01_signin.png
        frame: phone
        title: { ru: "Вход в ивент-центр", en: "Sign in to the event center", es: "Acceso al centro de eventos" }
        weight: 2
        per_format:
          16x9:
            image: captures/d_e_01_signin.png
            frame: browser
            address: "events.arenasoldout.com/login"
            zoom: { from: 1.5, to: 1.65, x: 0.5, y: 0.15 }
      - image: captures/e_02_first.png
        frame: phone
        title: { ru: "Первые шаги", en: "First steps", es: "Primeros pasos" }
        weight: 4
        zoom: { from: 1.0, to: 1.12, x: 0.5, y: 0.6 }
        per_format:
          16x9:
            image: captures/d_e_02_first.png
            frame: browser
            address: "events.arenasoldout.com"
            zoom: { from: 1.3, to: 1.42, x: 0.5, y: 0.1 }
      - image: captures/e_02_first_full.png
        frame: phone
        title: { ru: "Создайте первое мероприятие", en: "Add your first event", es: "Crea tu primer evento" }
        weight: 3
        scroll: { from: 0.55, to: 1.0 }
        per_format:
          16x9:
            image: captures/d_e_02_first.png
            frame: browser
            address: "events.arenasoldout.com"
            zoom: { from: 1.42, to: 1.42, x: 0.5, y: 0.8 }

  - id: s7-cta
    narration:
      ru: "Оставьте заявку на arenasoldout.com или в нашем Telegram-боте. Мы ждём вас."
      en: "Apply at arenasoldout.com or in our Telegram bot. We look forward to working with you."
      es: "Deja tu solicitud en arenasoldout.com o en nuestro bot de Telegram. Te esperamos."
    pause_after: 2.0
    shots:
      - graphic: cta
        heading: { ru: "Оставьте заявку", en: "Apply now", es: "Deja tu solicitud" }
        lines: ["arenasoldout.com", "@EventsCentrBot"]
        qr: "https://t.me/EventsCentrBot?start=apply"
