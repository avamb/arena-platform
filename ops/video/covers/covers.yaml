# Cover texts and subject images. Paths are relative to ops/video unless absolute.
# A missing image is skipped (the cover is rendered without a subject).
# line1 = dark first line, line2 = blue second line, sub = plain line below.
formats:
  16x9: { width: 1280, height: 720 }
  9x16: { width: 1080, height: 1920 }
  4x5: { width: 1080, height: 1350 }

films:
  sell-01:
    # Poster inside a phone frame.
    item:
      default:
        kind: phone
        status: "#0b1230"
        src:
          ru: scenarios/sell-01/assets/poster_vecher_dzhaza_4x5.png
          en: scenarios/sell-01/assets/en/poster_vecher_dzhaza_4x5.png
          es: scenarios/sell-01/assets/es/poster_vecher_dzhaza_4x5.png
    texts:
      ru:
        line1: "АФИША ГОТОВА?"
        line2: "ПРОДАВАЙТЕ БИЛЕТЫ"
        sub: "Продажа запускается за несколько минут. Деньги сразу на ваш счёт."
      en:
        line1: "GOT A POSTER?"
        line2: "START SELLING TICKETS"
        sub: "Go on sale in a few minutes. Money goes straight to your account."
      es:
        line1: "¿TIENES UN CARTEL?"
        line2: "VENDE ENTRADAS"
        sub: "Empieza a vender en unos minutos. El dinero va directo a tu cuenta."

  onb-01:
    # Bot welcome screen with the apply button; the capture has an empty lower part, so crop it.
    item:
      default:
        kind: phone
        crop: { x: 0, y: 0, w: 1, h: 0.66 }
        src:
          ru: scenarios/onb-01/captures/ru/a_00_welcome.png
          en: scenarios/onb-01/captures/en/a_00_welcome.png
          es: scenarios/onb-01/captures/es/a_00_welcome.png
    texts:
      ru:
        line1: "ЗАЯВКА ОРГАНИЗАТОРА"
        line2: "ПРЯМО В TELEGRAM"
        sub: "Несколько минут в боте — и вы в Arena Sold Out."
      en:
        line1: "APPLY AS AN ORGANIZER"
        line2: "RIGHT IN TELEGRAM"
        sub: "A few minutes in the bot, and you are in Arena Sold Out."
      es:
        line1: "SOLICITUD DE ORGANIZADOR"
        line2: "DIRECTAMENTE EN TELEGRAM"
        sub: "Unos minutos en el bot y ya estás en Arena Sold Out."

  apply-on-website:
    # The site's "Start selling" application page: desktop window for 16x9, phone for the vertical formats.
    item:
      16x9:
        kind: browser
        crop: { x: 0.04, y: 0.14, w: 0.62, h: 0.62 }
        src:
          ru: scenarios/apply-on-website/captures/d_f_01_start.png
          en: scenarios/apply-on-website/captures/en/d_f_01_start.png
          es: scenarios/apply-on-website/captures/es/d_f_01_start.png
      default:
        kind: phone
        status: "#ffffff"
        crop: { x: 0, y: 0, w: 1, h: 0.5 }
        src:
          ru: scenarios/apply-on-website/captures/f_01_start.png
          en: scenarios/apply-on-website/captures/en/f_01_start.png
          es: scenarios/apply-on-website/captures/es/f_01_start.png
    texts:
      ru:
        line1: "НАЧНИТЕ ПРОДАВАТЬ"
        line2: "ЗАЯВКА НА САЙТЕ"
        sub: "От заявки до вашего ивент-центра."
      en:
        line1: "START SELLING"
        line2: "APPLY ON THE WEBSITE"
        sub: "From the application to your event center."
      es:
        line1: "EMPIEZA A VENDER"
        line2: "SOLICITUD EN LA WEB"
        sub: "De la solicitud a tu centro de eventos."

  # The how-to films of the web event center: a desktop capture in a browser window for 16x9,
  # the middle column of the same capture (or the poster) in a phone frame for the vertical formats.
  web-create-event:
    item:
      16x9:
        kind: browser
        crop: { x: 0.27, y: 0.12, w: 0.46, h: 0.46 }
        src:
          ru: scenarios/web-create-event/captures/w_03_name.png
          en: scenarios/web-create-event/captures/en/w_03_name.png
          es: scenarios/web-create-event/captures/es/w_03_name.png
      default:
        kind: phone
        status: "#0b1230"
        src:
          ru: scenarios/web-create-event/assets/poster_4x5.png
          en: scenarios/web-create-event/assets/en/poster_4x5.png
          es: scenarios/web-create-event/assets/es/poster_4x5.png
    texts:
      ru:
        line1: "МЕРОПРИЯТИЕ ВРУЧНУЮ"
        line2: "ОТ НАЗВАНИЯ ДО ПРОДАЖИ"
        sub: "Название, дата, площадка, билеты и афиша в веб-ивент-центре."
      en:
        line1: "ADD AN EVENT BY HAND"
        line2: "FROM THE NAME TO THE SALE"
        sub: "Name, date, venue, tickets and poster in the web event center."
      es:
        line1: "CREA UN EVENTO A MANO"
        line2: "DEL NOMBRE A LA VENTA"
        sub: "Nombre, fecha, recinto, entradas y cartel en el centro de eventos web."

  web-payments-status:
    item:
      16x9:
        kind: browser
        crop: { x: 0.27, y: 0.12, w: 0.46, h: 0.46 }
        src:
          ru: scenarios/web-payments-status/captures/p_03_not_connected.png
          en: scenarios/web-payments-status/captures/en/p_03_not_connected.png
          es: scenarios/web-payments-status/captures/es/p_03_not_connected.png
      default:
        kind: phone
        crop: { x: 0.27, y: 0.1, w: 0.46, h: 0.88 }
        src:
          ru: scenarios/web-payments-status/captures/p_03_not_connected.png
          en: scenarios/web-payments-status/captures/en/p_03_not_connected.png
          es: scenarios/web-payments-status/captures/es/p_03_not_connected.png
    texts:
      ru:
        line1: "ПРИЁМ ОПЛАТЫ"
        line2: "ПОДКЛЮЧЁН ИЛИ НЕТ?"
        sub: "Где это посмотреть в ивент-центре."
      en:
        line1: "PAYMENTS FROM BUYERS"
        line2: "CONNECTED OR NOT?"
        sub: "Where to see it in the event center."
      es:
        line1: "COBRO A COMPRADORES"
        line2: "¿CONECTADO O NO?"
        sub: "Dónde verlo en el centro de eventos."

  web-organization-details:
    item:
      16x9:
        kind: browser
        crop: { x: 0.27, y: 0.1, w: 0.46, h: 0.5 }
        src:
          ru: scenarios/web-organization-details/captures/o_03_legal.png
          en: scenarios/web-organization-details/captures/en/o_03_legal.png
          es: scenarios/web-organization-details/captures/es/o_03_legal.png
      default:
        kind: phone
        crop: { x: 0.27, y: 0.1, w: 0.46, h: 0.88 }
        src:
          ru: scenarios/web-organization-details/captures/o_03_legal.png
          en: scenarios/web-organization-details/captures/en/o_03_legal.png
          es: scenarios/web-organization-details/captures/es/o_03_legal.png
    texts:
      ru:
        line1: "ДАННЫЕ ОРГАНИЗАЦИИ"
        line2: "ЧТО ВИДИТ ПОКУПАТЕЛЬ"
        sub: "Юридические данные и контакты: заполните один раз."
      en:
        line1: "ORGANIZATION DATA"
        line2: "WHAT THE BUYER SEES"
        sub: "Legal data and contacts: fill them in once."
      es:
        line1: "DATOS DE LA ORGANIZACIÓN"
        line2: "LO QUE VE EL COMPRADOR"
        sub: "Datos legales y contactos: rellénalos una sola vez."

  web-sales-link-and-qr:
    item:
      16x9:
        kind: browser
        crop: { x: 0.1, y: 0.03, w: 0.5, h: 0.62 }
        src:
          ru: scenarios/web-sales-link-and-qr/captures/k_05_qr.png
          en: scenarios/web-sales-link-and-qr/captures/en/k_05_qr.png
          es: scenarios/web-sales-link-and-qr/captures/es/k_05_qr.png
      default:
        kind: phone
        crop: { x: 0.13, y: 0.05, w: 0.32, h: 0.7 }
        src:
          ru: scenarios/web-sales-link-and-qr/captures/k_05_qr.png
          en: scenarios/web-sales-link-and-qr/captures/en/k_05_qr.png
          es: scenarios/web-sales-link-and-qr/captures/es/k_05_qr.png
    texts:
      ru:
        line1: "ССЫЛКА И QR"
        line2: "ДЛЯ КАЖДОЙ АФИШИ"
        sub: "Каждый скан считается, заказы привязаны к коду."
      en:
        line1: "LINK AND QR"
        line2: "FOR EACH POSTER"
        sub: "Each scan is counted, orders are tied to the code."
      es:
        line1: "ENLACE Y QR"
        line2: "PARA CADA CARTEL"
        sub: "Cada escaneo se cuenta y los pedidos quedan ligados al código."
