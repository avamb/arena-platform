# Cover texts and subject images. Paths are relative to ops/video unless absolute.
# A missing image is skipped (the cover is rendered without a subject).
# line1 = dark first line, line2 = blue second line, sub = plain line below.
formats:
  16x9: { width: 1280, height: 720 }
  9x16: { width: 1080, height: 1920 }
  4x5: { width: 1080, height: 1350 }

films:
  sell-tickets-from-poster:
    # Poster inside a phone frame.
    item:
      default:
        kind: phone
        status: "#0b1230"
        src:
          ru: scenarios/sell-tickets-from-poster/assets/poster_vecher_dzhaza_4x5.png
          en: scenarios/sell-tickets-from-poster/assets/en/poster_vecher_dzhaza_4x5.png
          es: scenarios/sell-tickets-from-poster/assets/es/poster_vecher_dzhaza_4x5.png
    texts:
      ru:
        line1: "АФИША ГОТОВА?"
        line2: "ПРОДАВАЙТЕ БИЛЕТЫ"
        sub: "Продажа запускается за несколько минут. Деньги сразу на ваш счёт."
      en:
        line1: "GOT A POSTER?"
        line2: "START SELLING TICKETS"
        sub: "Go on sale in a few minutes. Money goes straight to your account."
      es:
        line1: "¿TIENES UN CARTEL?"
        line2: "VENDE ENTRADAS"
        sub: "Empieza a vender en unos minutos. El dinero va directo a tu cuenta."

  apply-in-telegram-bot:
    # Bot welcome screen with the apply button; the capture has an empty lower part, so crop it.
    item:
      default:
        kind: phone
        crop: { x: 0, y: 0, w: 1, h: 0.66 }
        src:
          ru: scenarios/apply-in-telegram-bot/captures/ru/a_00_welcome.png
          en: scenarios/apply-in-telegram-bot/captures/en/a_00_welcome.png
          es: scenarios/apply-in-telegram-bot/captures/es/a_00_welcome.png
    texts:
      ru:
        line1: "ЗАЯВКА ОРГАНИЗАТОРА"
        line2: "ПРЯМО В TELEGRAM"
        sub: "Несколько минут в боте — и вы в Arena Sold Out."
      en:
        line1: "APPLY AS AN ORGANIZER"
        line2: "RIGHT IN TELEGRAM"
        sub: "A few minutes in the bot, and you are in Arena Sold Out."
      es:
        line1: "SOLICITUD DE ORGANIZADOR"
        line2: "DIRECTAMENTE EN TELEGRAM"
        sub: "Unos minutos en el bot y ya estás en Arena Sold Out."

  onb-02:
    # The site's "Start selling" application page: desktop window for 16x9, phone for the vertical formats.
    # Captures live in another worktree (read only).
    item:
      16x9:
        kind: browser
        crop: { x: 0.04, y: 0.14, w: 0.62, h: 0.62 }
        src:
          ru: C:/Projects/arena_new/.claude/worktrees/serene-fermat-bab452/ops/video/scenarios/onb-02/captures/d_f_01_start.png
          en: C:/Projects/arena_new/.claude/worktrees/serene-fermat-bab452/ops/video/scenarios/onb-02/captures/en/d_f_01_start.png
          es: C:/Projects/arena_new/.claude/worktrees/serene-fermat-bab452/ops/video/scenarios/onb-02/captures/es/d_f_01_start.png
      default:
        kind: phone
        status: "#ffffff"
        crop: { x: 0, y: 0, w: 1, h: 0.5 }
        src:
          ru: C:/Projects/arena_new/.claude/worktrees/serene-fermat-bab452/ops/video/scenarios/onb-02/captures/f_01_start.png
          en: C:/Projects/arena_new/.claude/worktrees/serene-fermat-bab452/ops/video/scenarios/onb-02/captures/en/f_01_start.png
          es: C:/Projects/arena_new/.claude/worktrees/serene-fermat-bab452/ops/video/scenarios/onb-02/captures/es/f_01_start.png
    texts:
      ru:
        line1: "НАЧНИТЕ ПРОДАВАТЬ"
        line2: "ЗАЯВКА НА САЙТЕ"
        sub: "От заявки до вашего ивент-центра."
      en:
        line1: "START SELLING"
        line2: "APPLY ON THE WEBSITE"
        sub: "From the application to your event center."
      es:
        line1: "EMPIEZA A VENDER"
        line2: "SOLICITUD EN LA WEB"
        sub: "De la solicitud a tu centro de eventos."

  bot-create-event-from-poster:
    # The bot has read the poster; the capture has an empty lower part, so crop it.
    item:
      default:
        kind: phone
        crop: { x: 0, y: 0, w: 1, h: 0.66 }
        src:
          ru: scenarios/bot-create-event-from-poster/captures/ru/h_03c_poster.png
          en: scenarios/bot-create-event-from-poster/captures/en/h_03c_poster.png
          es: scenarios/bot-create-event-from-poster/captures/es/h_03c_poster.png
    texts:
      ru:
        line1: "МЕРОПРИЯТИЕ"
        line2: "ПО АФИШЕ"
        sub: "Отправьте афишу боту: он прочитает название, дату и цену."
      en:
        line1: "AN EVENT"
        line2: "FROM A POSTER"
        sub: "Send the poster to the bot: it reads the name, the date and the price."
      es:
        line1: "UN EVENTO"
        line2: "DESDE UN CARTEL"
        sub: "Envía el cartel al bot: lee el nombre, la fecha y el precio."

  bot-sales-link-and-qr:
    # The QR code that the bot sends; the capture has an empty lower part, so crop it.
    item:
      default:
        kind: phone
        crop: { x: 0, y: 0, w: 1, h: 0.66 }
        src:
          ru: scenarios/bot-sales-link-and-qr/captures/ru/q_06_qr.png
          en: scenarios/bot-sales-link-and-qr/captures/en/q_06_qr.png
          es: scenarios/bot-sales-link-and-qr/captures/es/q_06_qr.png
    texts:
      ru:
        line1: "ССЫЛКА ПРОДАЖ"
        line2: "И QR-КОД"
        sub: "Бот даёт ссылку и код для афиши и считает сканы."
      en:
        line1: "SALES LINK"
        line2: "AND QR CODE"
        sub: "The bot gives you a link and a code for the poster, and counts the scans."
      es:
        line1: "ENLACE DE VENTA"
        line2: "Y CÓDIGO QR"
        sub: "El bot te da un enlace y un código para el cartel, y cuenta los escaneos."

  bot-orders-resend-tickets:
    # An order card in the bot. The capture has an empty lower part, so crop it.
    item:
      default:
        kind: phone
        crop: { x: 0, y: 0, w: 1, h: 0.66 }
        src:
          ru: scenarios/bot-orders-resend-tickets/captures/ru/o_04_card.png
          en: scenarios/bot-orders-resend-tickets/captures/en/o_04_card.png
          es: scenarios/bot-orders-resend-tickets/captures/es/o_04_card.png
    texts:
      ru:
        line1: "ЗАКАЗ НАЙДЕН"
        line2: "БИЛЕТЫ ОТПРАВЛЕНЫ"
        sub: "Найдите заказ в боте и вышлите билеты ещё раз."
      en:
        line1: "FIND THE ORDER"
        line2: "SEND THE TICKETS AGAIN"
        sub: "Find an order in the bot and send its tickets again."
      es:
        line1: "BUSCA EL PEDIDO"
        line2: "REENVÍA LAS ENTRADAS"
        sub: "Busca un pedido en el bot y reenvía sus entradas."

  bot-promo-codes:
    # The card of a new promo code. The capture has an empty lower part, so crop it.
    item:
      default:
        kind: phone
        crop: { x: 0, y: 0, w: 1, h: 0.66 }
        src:
          ru: scenarios/bot-promo-codes/captures/ru/c_12_created.png
          en: scenarios/bot-promo-codes/captures/en/c_12_created.png
          es: scenarios/bot-promo-codes/captures/es/c_12_created.png
    texts:
      ru:
        line1: "ПРОМОКОД"
        line2: "НА СКИДКУ"
        sub: "Создайте код в боте за минуту."
      en:
        line1: "A PROMO CODE"
        line2: "FOR A DISCOUNT"
        sub: "Make a code in the bot in a minute."
      es:
        line1: "UN CÓDIGO"
        line2: "DE DESCUENTO"
        sub: "Crea un código en el bot en un minuto."

  bot-invite-manager:
    # The team list after an invitation. The capture has an empty lower part, so crop it.
    item:
      default:
        kind: phone
        crop: { x: 0, y: 0, w: 1, h: 0.66 }
        src:
          ru: scenarios/bot-invite-manager/captures/ru/t_04_sent.png
          en: scenarios/bot-invite-manager/captures/en/t_04_sent.png
          es: scenarios/bot-invite-manager/captures/es/t_04_sent.png
    texts:
      ru:
        line1: "ПРИГЛАСИТЕ"
        line2: "МЕНЕДЖЕРА"
        sub: "Добавьте коллегу в команду прямо из бота."
      en:
        line1: "INVITE"
        line2: "A MANAGER"
        sub: "Add a colleague to your team from the bot."
      es:
        line1: "INVITA"
        line2: "A UN GESTOR"
        sub: "Añade a un compañero a tu equipo desde el bot."

  bot-change-price:
    # The bot asks to save the new price. The capture has an empty lower part, so crop it.
    item:
      default:
        kind: phone
        crop: { x: 0, y: 0, w: 1, h: 0.66 }
        src:
          ru: scenarios/bot-change-price/captures/ru/pr_06_confirm.png
          en: scenarios/bot-change-price/captures/en/pr_06_confirm.png
          es: scenarios/bot-change-price/captures/es/pr_06_confirm.png
    texts:
      ru:
        line1: "НОВАЯ ЦЕНА"
        line2: "БИЛЕТА"
        sub: "Измените цену в боте, когда продажа уже идёт."
      en:
        line1: "A NEW"
        line2: "TICKET PRICE"
        sub: "Change the price in the bot while tickets are on sale."
      es:
        line1: "NUEVO PRECIO"
        line2: "DE LA ENTRADA"
        sub: "Cambia el precio en el bot con la venta abierta."

  bot-invitations:
    # The bot has issued two invitations. The capture has an empty lower part, so crop it.
    item:
      default:
        kind: phone
        crop: { x: 0, y: 0, w: 1, h: 0.66 }
        src:
          ru: scenarios/bot-invitations/captures/ru/i_07_sent.png
          en: scenarios/bot-invitations/captures/en/i_07_sent.png
          es: scenarios/bot-invitations/captures/es/i_07_sent.png
    texts:
      ru:
        line1: "БЕСПЛАТНЫЕ БИЛЕТЫ"
        line2: "ДЛЯ ГОСТЕЙ"
        sub: "Выдайте приглашения в боте: билет придёт гостю на почту."
      en:
        line1: "FREE TICKETS"
        line2: "FOR GUESTS"
        sub: "Issue invitations in the bot: each guest gets a ticket by e-mail."
      es:
        line1: "ENTRADAS GRATUITAS"
        line2: "PARA INVITADOS"
        sub: "Emite invitaciones en el bot: cada invitado recibe su entrada por e-mail."

  bot-move-or-cancel-session:
    # The bot shows the move of a session and the message to buyers. The capture has an empty lower part, so crop it.
    item:
      default:
        kind: phone
        crop: { x: 0, y: 0, w: 1, h: 0.66 }
        src:
          ru: scenarios/bot-move-or-cancel-session/captures/ru/s_08_review.png
          en: scenarios/bot-move-or-cancel-session/captures/en/s_08_review.png
          es: scenarios/bot-move-or-cancel-session/captures/es/s_08_review.png
    texts:
      ru:
        line1: "ПЕРЕНОС"
        line2: "ИЛИ ОТМЕНА СЕАНСА"
        sub: "Измените дату в боте: покупатели получат письмо."
      en:
        line1: "MOVE OR CANCEL"
        line2: "A SESSION"
        sub: "Change the date in the bot: the buyers get an e-mail."
      es:
        line1: "CAMBIA O CANCELA"
        line2: "UNA SESIÓN"
        sub: "Cambia la fecha en el bot: los compradores reciben un e-mail."

  sell-tickets-from-poster-short:
    # The short vertical version has the same cover.
    item:
      default:
        kind: phone
        status: "#0b1230"
        src:
          ru: scenarios/sell-tickets-from-poster/assets/poster_vecher_dzhaza_4x5.png
          en: scenarios/sell-tickets-from-poster/assets/en/poster_vecher_dzhaza_4x5.png
          es: scenarios/sell-tickets-from-poster/assets/es/poster_vecher_dzhaza_4x5.png
    texts:
      ru:
        line1: "АФИША ГОТОВА?"
        line2: "ПРОДАВАЙТЕ БИЛЕТЫ"
        sub: "Продажа запускается за несколько минут. Деньги сразу на ваш счёт."
      en:
        line1: "GOT A POSTER?"
        line2: "START SELLING TICKETS"
        sub: "Go on sale in a few minutes. Money goes straight to your account."
      es:
        line1: "¿TIENES UN CARTEL?"
        line2: "VENDE ENTRADAS"
        sub: "Empieza a vender en unos minutos. El dinero va directo a tu cuenta."
