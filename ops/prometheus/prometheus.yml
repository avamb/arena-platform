global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development

scrape_configs:
  - job_name: arena-api
    static_configs:
      - targets: ['api:8080']
    metrics_path: /metrics
    scrape_interval: 15s
    # When METRICS_BEARER_TOKEN is set on arena-api (recommended once the
    # deployment is reachable from outside the compose network — see
    # docs/ops/monitoring_runbook_ru.md), uncomment and fill in the same
    # value here so Prometheus can still scrape:
    # authorization:
    #   credentials: "<METRICS_BEARER_TOKEN value>"

  - job_name: arena-worker
    static_configs:
      - targets: ['worker:9091']
    metrics_path: /metrics
    scrape_interval: 15s
    # Same METRICS_BEARER_TOKEN guard applies to the worker's own /metrics
    # sidecar (WORKER_METRICS_ADDR, default :9091):
    # authorization:
    #   credentials: "<METRICS_BEARER_TOKEN value>"

  # k6 Prometheus remote-write receiver (optional; used during load test runs).
  # k6 pushes metrics via: k6 run --out experimental-prometheus-rw <script>
  # with K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
  # The metrics land as k6_* series and are displayed on the Load Test
  # Results row in the arena_platform_overview Grafana dashboard.
